name: VilaShop - Format and repair PR 11

on:
  push:
    branches:
      - vilashop/manual-wallet-payments-reconciled
    paths:
      - .github/workflows/vilashop-pr-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: vilashop/manual-wallet-payments-reconciled
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Correct unsafe any casts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/routes/admin.tsx")
          text = path.read_text()
          text = text.replace('(saleResult.data ?? []) as any[]', '(saleResult.data ?? []) as unknown as Array<Record<string, unknown>>')
          text = text.replace('(messageFlagResult.data ?? []) as any[]', '(messageFlagResult.data ?? []) as unknown as AdminMessageFlag[]')
          path.write_text(text)
          PY
      - name: Format files reported by CI
        run: |
          bunx prettier --write \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/lib/message-moderation.test.ts \
            src/routes/admin.tsx
      - name: Commit formatting corrections
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/integrations/supabase/previewAuthStorage.ts src/integrations/supabase/types.ts src/lib/message-moderation.test.ts src/routes/admin.tsx
            git commit -m "fix: format VilaShop PR 11 and remove explicit any casts [skip ci]"
            git push origin HEAD:vilashop/manual-wallet-payments-reconciled
          else
            echo "No formatting changes were necessary."
          fi
