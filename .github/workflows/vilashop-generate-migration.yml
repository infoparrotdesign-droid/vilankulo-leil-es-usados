name: VilaShop - Generate Supabase migration

on:
  push:
    branches:
      - vilashop/rebuild-foundation
    paths:
      - "supabase/migration-drafts/*.sql"

permissions:
  contents: write

concurrency:
  group: vilashop-migration-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate timestamped migration with Supabase CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: vilashop/rebuild-foundation

      - name: Synchronize with the latest branch before generating
        run: git pull --rebase origin vilashop/rebuild-foundation

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.3.0

      - name: Generate migration filename using Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          drafts=(supabase/migration-drafts/*.sql)
          if [ "${#drafts[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one migration draft; found ${#drafts[@]}."
            exit 1
          fi
          draft="${drafts[0]}"
          base="$(basename "$draft" .sql)"
          supabase migration new "$base"
          generated=(supabase/migrations/*_"$base".sql)
          if [ "${#generated[@]}" -ne 1 ]; then
            echo "::error::Could not identify the generated migration file."
            exit 1
          fi
          cp "$draft" "${generated[0]}"
          rm "$draft"
          echo "Generated migration: ${generated[0]}"

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations supabase/migration-drafts
          git commit -m "Add VilaShop community and transaction migration"
          git push origin vilashop/rebuild-foundation
