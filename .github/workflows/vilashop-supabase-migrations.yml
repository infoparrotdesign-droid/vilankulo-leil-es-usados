name: VilaShop - Test direct PostgreSQL and deploy migrations

on:
  push:
    branches:
      - vilashop/rebuild-foundation
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/cleanup-listing-photos/**"
      - "supabase/functions/send-admin-notification/**"
      - ".github/workflows/vilashop-supabase-migrations.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Aplicar migrations depois de o teste directo passar"
        required: true
        type: boolean
        default: false
      run_photo_cleanup:
        description: "Executar a limpeza de fotografias que já passaram 72 horas"
        required: true
        type: boolean
        default: false
      deploy_admin_notifications:
        description: "Configurar Gmail e publicar as funções de alerta de mensagens sinalizadas"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vilashop-supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    # Production linking, dry-run, and Edge Function deployment are manual-only.
    # A push to the repository must never perform production operations implicitly.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.apply_migrations == true || inputs.run_photo_cleanup == true) }}
    name: Test direct PostgreSQL connection
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ibwasunbdqplanwhnexf

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing production environment secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing production environment secret SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.3.0

      - name: Link using direct PostgreSQL endpoint (bypass pooler)
        shell: bash
        run: |
          grep -Fxq "project_id = \"$SUPABASE_PROJECT_ID\"" supabase/config.toml
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --skip-pooler

      - name: Preview pending migrations over direct connection only
        run: supabase db push --dry-run --remote="$SUPABASE_PROJECT_ID"

      - name: Apply pending migrations only when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: supabase db push --yes --remote="$SUPABASE_PROJECT_ID"

      - name: Verify remote migration history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true }}
        run: supabase migration list --remote="$SUPABASE_PROJECT_ID"

  deploy_admin_notifications:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_admin_notifications == true }}
    name: Configure Gmail and deploy moderation notifications
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      SUPABASE_PROJECT_ID: ibwasunbdqplanwhnexf
    steps:
      - name: Validate protected deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing production secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$GMAIL_CLIENT_ID" || { echo "::error::Missing production secret GMAIL_CLIENT_ID"; exit 1; }
          test -n "$GMAIL_CLIENT_SECRET" || { echo "::error::Missing production secret GMAIL_CLIENT_SECRET"; exit 1; }
          test -n "$GMAIL_REFRESH_TOKEN" || { echo "::error::Missing production secret GMAIL_REFRESH_TOKEN"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.3.0

      - name: Configure Gmail OAuth secrets in Supabase
        shell: bash
        run: |
          MAILER_TOKEN="$(printf 'vilashop-mailer:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          supabase secrets set --yes --project-ref "$SUPABASE_PROJECT_ID" \\
            "GMAIL_CLIENT_ID=$GMAIL_CLIENT_ID" \\
            "GMAIL_CLIENT_SECRET=$GMAIL_CLIENT_SECRET" \\
            "GMAIL_REFRESH_TOKEN=$GMAIL_REFRESH_TOKEN" \\
            "VILASHOP_MAILER_TOKEN=$MAILER_TOKEN"

      - name: Deploy protected Gmail mailer
        run: supabase functions deploy send-admin-notification --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy authenticated message-flag endpoint
        run: supabase functions deploy flag-message --project-ref "$SUPABASE_PROJECT_ID" --yes

  cleanup_photos:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_photo_cleanup == true) }}
    name: Remove listing photos after 72 hours
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Validate cleanup secret
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Run photo cleanup function
        shell: bash
        run: |
          CLEANUP_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-vilashop-cleanup-token: $CLEANUP_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://ibwasunbdqplanwhnexf.supabase.co/functions/v1/cleanup-listing-photos"
