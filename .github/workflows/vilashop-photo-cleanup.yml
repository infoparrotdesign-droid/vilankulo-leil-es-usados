name: VilaShop - Deploy photo cleanup function
# Deploy on source changes; run the cleanup worker hourly.

on:
  push:
    branches:
      - vilashop/rebuild-foundation
    paths:
      - "supabase/functions/cleanup-listing-photos/**"
      - "supabase/config.toml"
      - ".github/workflows/vilashop-photo-cleanup.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: vilashop-photo-cleanup
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ibwasunbdqplanwhnexf
    steps:
      - uses: actions/checkout@v5

      - name: Validate deployment secret
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.3.0

      - name: Check supported CLI commands
        shell: bash
        run: |
          supabase secrets set --help >/dev/null
          supabase functions deploy --help >/dev/null

      - name: Configure private cleanup invocation token
        shell: bash
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" "VILASHOP_CLEANUP_TOKEN=$SUPABASE_ACCESS_TOKEN"

      - name: Deploy cleanup function
        run: supabase functions deploy cleanup-listing-photos --project-ref "$SUPABASE_PROJECT_ID"

  cleanup:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Validate cleanup secret
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Remove listing photos past their 72-hour retention deadline
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "x-vilashop-cleanup-token: $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://ibwasunbdqplanwhnexf.supabase.co/functions/v1/cleanup-listing-photos"
