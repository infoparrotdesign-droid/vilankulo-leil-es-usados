name: VilaShop - Isolated manual wallet migration test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - vilashop/rebuild-foundation
    paths:
      - "supabase/migrations/20261126110000_fix_sale_financial_capture_trigger.sql"
      - "supabase/migrations/20261126140000_vilashop_manual_wallet_payments.sql"
      - "supabase/tests/manual-wallet-payments-*.sql"
      - ".github/workflows/vilashop-manual-wallet-payments-test.yml"
  push:
    branches:
      - vilashop/manual-wallet-payments-reconciled
    paths:
      - "supabase/migrations/20261126110000_fix_sale_financial_capture_trigger.sql"
      - "supabase/migrations/20261126140000_vilashop_manual_wallet_payments.sql"
      - "supabase/tests/manual-wallet-payments-*.sql"
      - ".github/workflows/vilashop-manual-wallet-payments-test.yml"

permissions:
  contents: write

jobs:
  postgres-manual-wallet-test:
    name: Apply and test manual wallet migration on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vilashop_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vilashop_wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/tests/manual-wallet-payments-setup.sql
      - name: Apply financial trigger migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126110000_fix_sale_financial_capture_trigger.sql
      - name: Apply manual wallet migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126140000_vilashop_manual_wallet_payments.sql
      - name: Install post-migration test helpers
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/tests/manual-wallet-payments-test-helpers.sql
      - name: Verify checkout, privacy, reporting, and payout rules
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/tests/manual-wallet-payments.test.sql

  format-pr:
    name: Format and repair PR 11 source files
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v5
        with:
          ref: vilashop/manual-wallet-payments-reconciled
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Remove explicit any casts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/routes/admin.tsx")
          source = path.read_text()
          source = source.replace('(saleResult.data ?? []) as any[]', '(saleResult.data ?? []) as unknown as Array<Record<string, unknown>>')
          source = source.replace('(messageFlagResult.data ?? []) as any[]', '(messageFlagResult.data ?? []) as unknown as AdminMessageFlag[]')
          path.write_text(source)
          PY
      - name: Apply repository formatting
        run: |
          bunx prettier --write \
            src/integrations/supabase/previewAuthStorage.ts \
            src/integrations/supabase/types.ts \
            src/lib/message-moderation.test.ts \
            src/routes/admin.tsx
      - name: Commit and push corrections
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/integrations/supabase/previewAuthStorage.ts src/integrations/supabase/types.ts src/lib/message-moderation.test.ts src/routes/admin.tsx
            git commit -m "fix: format VilaShop PR 11 and remove explicit any casts [skip ci]"
            git push origin HEAD:vilashop/manual-wallet-payments-reconciled
          else
            echo "No formatting changes were necessary."
          fi
