name: VilaShop - Isolated manual wallet migration test

on:
  pull_request:
    branches:
      - vilashop/rebuild-foundation
    paths:
      - "supabase/migrations/20261126110000_fix_sale_financial_capture_trigger.sql"
      - "supabase/migrations/20261126140000_vilashop_manual_wallet_payments.sql"
      - "supabase/tests/manual-wallet-payments-*.sql"
      - ".github/workflows/vilashop-manual-wallet-payments-test.yml"
  push:
    branches:
      - vilashop/manual-wallet-payments-reconciled
    paths:
      - "supabase/migrations/20261126110000_fix_sale_financial_capture_trigger.sql"
      - "supabase/migrations/20261126140000_vilashop_manual_wallet_payments.sql"
      - "supabase/tests/manual-wallet-payments-*.sql"
      - ".github/workflows/vilashop-manual-wallet-payments-test.yml"

permissions:
  contents: read

jobs:
  postgres-manual-wallet-test:
    name: Apply and test manual wallet migration on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vilashop_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vilashop_wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/tests/manual-wallet-payments-setup.sql
      - name: Apply financial trigger migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126110000_fix_sale_financial_capture_trigger.sql
      - name: Apply manual wallet migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261126140000_vilashop_manual_wallet_payments.sql
      - name: Verify checkout, privacy, reporting, and payout rules
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d vilashop_wallet_test -v ON_ERROR_STOP=1 -f supabase/tests/manual-wallet-payments.test.sql
