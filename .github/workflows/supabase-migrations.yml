name: Apply VilaShop Supabase migrations

on:
  push:
    branches:
      - vilashop/rebuild-foundation
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vilashop-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply pending migrations to VilaShop Supabase
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ibwasunbdqplanwhnexf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required credentials and target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN GitHub Actions secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD GitHub Actions secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "ibwasunbdqplanwhnexf"
          grep -Fx 'project_id = "ibwasunbdqplanwhnexf"' supabase/config.toml

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link exact VilaShop project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run --remote

      - name: Apply pending migrations
        run: supabase db push --yes --remote
