name: VilaShop - Quality checks
# Re-run complete quality checks for the latest moderation validation batch
# Includes the GitHub-only Gmail moderation integration branch
# Revalidate the delivery-lease and isolated mailer-token hardening batch
# Recheck payload guards, bounded Gmail calls and verified delivery-state writes

on:
  push:
    branches:
      - vilashop/rebuild-foundation
      - vilashop/phase-1-contact-safety
      - vilashop/gmail-message-moderation
    paths:
      - "src/**"
      - "supabase/**"
      - "docs/**"
      - ".env"
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/vilashop-quality.yml"
  pull_request:
    branches:
      - main
      - vilashop/rebuild-foundation
      - vilashop/phase-1-contact-safety

permissions:
  contents: read

concurrency:
  group: vilashop-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (strict, no ignored errors)
        run: bun run lint

      - name: Strict lint for VilaShop safety and moderation helpers
        run: bunx eslint src/lib/message-safety.ts src/lib/message-safety.test.ts src/lib/message-moderation.ts src/lib/message-moderation.test.ts

      - name: Run tests
        run: bun run test

      - name: Build production app (Node server preset)
        run: bun run build
        env:
          NITRO_PRESET: node_server

      - name: Smoke test production server
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          PORT=3000 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/vilashop-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then
              echo "Production server returned HTTP 200."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vilashop-server.log
          echo "Production server did not become healthy."
          exit 1
