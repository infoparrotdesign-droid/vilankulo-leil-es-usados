name: VilaShop - Quality checks

on:
  push:
    branches:
      - vilashop/rebuild-foundation
    paths:
      - "src/**"
      - ".env"
      - ".env.example"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - ".github/workflows/vilashop-quality.yml"
  pull_request:
    branches:
      - main
      - vilashop/rebuild-foundation

permissions:
  contents: read

concurrency:
  group: vilashop-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (existing repository baseline)
        run: bun run lint
        continue-on-error: true

      - name: Run tests
        run: bun run test

      - name: Build production app
        run: bun run build
